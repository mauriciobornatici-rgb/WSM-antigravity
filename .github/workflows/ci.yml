name: WSM SportsERP CI

on:
  push:
    branches:
      - main
      - master
      - staging
      - 'codex/**'
  pull_request:
    branches:
      - main
      - master
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Deterministic Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Environment Template (.env.example)
        run: npm run preflight:env -- --file=.env.example

      - name: Build Shared Contracts (@wsm/common)
        run: npm run build:common

      - name: Lint Frontend and Backend
        run: npm run lint

      - name: Typecheck Frontend & Contracts
        run: npm run typecheck

      - name: Run Frontend Tests (Vitest)
        run: npm run test:client

      - name: Build Frontend Production Bundle (Vite)
        run: npm run build

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high

  isolated-tests:
    name: Isolated Backend Tests and Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build:common

      - name: Verify QA wrapper guards
        run: npm run test:qa-guards

      - name: Run isolated backend coverage gate
        run: npm run test:coverage:isolated

  e2e:
    name: Playwright Chromium E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build:common

      - name: Build frontend bundle
        run: npm run build

      - name: Install official Playwright Chromium
        run: npm -w @wsm/client exec -- playwright install --with-deps chromium

      - name: Run E2E (authentication and POS checkout)
        run: npm -w @wsm/client run test:e2e

  mysql-qa:
    name: Ephemeral MySQL QA Smokes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm run build:common

      - name: Start dedicated ephemeral QA MySQL
        run: docker compose -f docker-compose.test.yml up -d --wait mysql

      - name: Bootstrap QA schema and smoke users
        run: npm run qa:bootstrap -- --allow-qa-bootstrap

      - name: Run referential integrity preflight
        run: npm run qa:preflight:integrity

      - name: Run integrity smoke
        run: npm run qa:smoke:integrity

      - name: Run RBAC smoke
        run: npm run qa:smoke:rbac

      # Locks, constraints and concurrency can only be proven against a real database.
      - name: Run real-MySQL integration tests
        run: npm run qa:integration

      - name: Remove ephemeral QA database
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans
