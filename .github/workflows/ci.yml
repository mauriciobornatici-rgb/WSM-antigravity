name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared contracts
        run: npm -w @wsm/common run build

      - name: Server tests
        run: npm -w @wsm/server run test:coverage

      - name: Client lint
        run: npm -w @wsm/client run lint

      - name: Client tests
        run: npm -w @wsm/client run test

      - name: Client typecheck
        run: npm -w @wsm/client run typecheck

      - name: Client build
        run: npm -w @wsm/client run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Client end-to-end tests
        run: npm -w @wsm/client run test:e2e

      - name: Dependency security audit
        run: npm audit --workspaces --audit-level=high
