name: WSM SportsERP CI

on:
  push:
    branches:
      - main
      - master
      - staging
      - 'codex/**'
  pull_request:
    branches:
      - main
      - master
      - staging

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Deterministic Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate Environment Template (.env.example)
        run: npm run preflight:env -- --file=.env.example

      - name: Build Shared Contracts (@wsm/common)
        run: npm run build:common

      - name: Run Backend Tests (Node Test Runner)
        run: npm run test:server

      - name: Lint Frontend (@wsm/client)
        run: npm run lint

      - name: Typecheck Frontend & Contracts
        run: npm run typecheck

      - name: Run Frontend Tests (Vitest)
        run: npm run test:client

      - name: Build Frontend Production Bundle (Vite)
        run: npm run build

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high
